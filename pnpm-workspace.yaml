# Pre-approve build scripts for the packages C3 itself installs that need
# them: `workerd` downloads the platform binary, `esbuild` and `sharp`
# (via miniflare) download/build native bindings. Without these, pnpm 11+
# aborts the install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
  core-js-pure: true
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.54.5"
  - "@cloudflare/workerd-darwin-64@1.20260907.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260907.1"
  - "@cloudflare/workerd-linux-64@1.20260907.1"
  - "@cloudflare/workerd-linux-arm64@1.20260907.1"
  - "@cloudflare/workerd-windows-64@1.20260907.1"
  - miniflare@5.20260907.0-alpha
  - workerd@1.20260907.1
  - wrangler@4.129.1
  - "@cloudflare/workers-types@5.20260907.1"
